name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar exámenes
        run: node tools/exam-builder/validate.js

      - name: Probar el Apps Script
        run: node apps-script/test.js

      - name: Preparar sitio
        # Solo la app: sin el servidor de desarrollo ni historiales locales.
        run: |
          rsync -a --exclude server.py --exclude __pycache__ --exclude 'historial.json*' web/ _site/
          # Versión en las URL de JS y CSS: tras publicar, nadie mezcla HTML nuevo con JS viejo
          # de la caché de GitHub Pages (10 min).
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/*.html
          ! grep -l "__BUILD__" _site/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
